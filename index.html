<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ad Link Editor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="#">Ad Link Editor</a>

  <div class="d-flex gap-2">
    <button class="btn btn-outline-light btn-sm" id="saveBtn">Save</button>
    <button class="btn btn-success btn-sm" id="exportBtn">Export HTML</button>
  </div>
</nav>

<div class="container-fluid py-3">
  <div class="row g-3">

    <aside class="col-lg-2">
      <div class="card shadow-sm">
        <div class="card-header fw-bold">Insert Elements</div>

        <div class="card-body d-grid gap-2">
          <button class="btn btn-outline-primary" data-action="bold">Bold</button>
          <button class="btn btn-outline-primary" data-action="italic">Italic</button>
          <button class="btn btn-outline-primary" data-action="underline">Underline</button>
          <button class="btn btn-outline-primary" data-action="h2">Heading</button>
          <button class="btn btn-outline-primary" data-action="paragraph">Paragraph</button>
          <button class="btn btn-outline-primary" data-action="ul">Bullet List</button>

          <button class="btn btn-outline-primary" id="linkBtn">Insert Link</button>
          <button class="btn btn-outline-primary" id="imageUrlBtn">Image URL</button>
          <button class="btn btn-outline-primary" id="uploadBtn">Upload Image</button>

          <input type="file" id="imageFile" accept="image/*" hidden>

          <button class="btn btn-outline-danger" id="clearBtn">Clear Document</button>
        </div>
      </div>
    </aside>

    <main class="col-lg-7">
      <div class="card shadow-sm">
        <div class="card-header">
          <strong>Document Editor</strong>
        </div>

        <div id="editor" contenteditable="true" spellcheck="true">
          <h2>My Advertisement</h2>
          <p>Start typing your content here...</p>
        </div>

        <div class="card-footer small text-secondary">
          Add text, headings, hyperlinks and images.
        </div>
      </div>
    </main>

    <section class="col-lg-3">
      <div class="card shadow-sm">
        <div class="card-header fw-bold">Live Preview</div>
        <div class="card-body" id="preview">
          Your preview will appear here.
        </div>
      </div>

      <p class="small text-secondary mt-2" id="status">Ready</p>
    </section>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
